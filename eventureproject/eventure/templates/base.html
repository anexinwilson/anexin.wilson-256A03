<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <nav class="bg-white shadow p-4 mb-6 flex justify-between">
    <div><a href="{% url 'events' %}" class="text-2xl font-bold">Eventure</a></div>
    <div>
      {% if user.is_authenticated %}
      <span class="mr-4">Hi, {{user.username}}</span>
      <a href="{% url 'signoutaccount' %}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
        Sign Out
      </a>
      {% else %}
      <a href="{% url 'loginaccount' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mr-2">
        Login
      </a>
      <a href="{% url 'signupaccount' %}" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Sign Up
      </a>
      {% endif %}
    </div>
  </nav>
  
  <div class="container mx-auto px-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
