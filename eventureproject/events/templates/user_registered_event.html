{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">My Registered Events</h2>

{% for event in events %}
  <div class="bg-white p-4 shadow rounded mb-4">
    <h3 class="text-xl font-semibold">{{ event.name }}</h3>
    <p class="text-sm text-gray-500">{{ event.start_date }}</p>
    <p class="text-gray-700 mt-2">{{ event.description }}</p>
    <a href="{% url 'event_view' event.id %}" class="text-blue-600 mt-2 inline-block">View Event</a>
  </div>
{% empty %}
  <p class="text-gray-500">You're not registered for any events.</p>
{% endfor %}
{% endblock %}
