{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white shadow-xl rounded-2xl p-10">
  <h2 class="text-3xl font-bold text-center text-blue-700 mb-8">Login</h2>
  {% if error %}<p class="text-red-500">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-6">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">Login</button>
  </form>
</div>
{% endblock %}
